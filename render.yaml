services:
  - type: web
    name: ledger-oracle
    env: docker
    plan: free
    envVars:
      - key: LEDGER_BACKEND
        value: supabase
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_READONLY_DB_URL
        sync: false
