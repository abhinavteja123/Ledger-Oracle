<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger Oracle -- Verify</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    margin: 0; padding: 16px; background: #0b0d10; color: #d8dee4;
    font-size: 14px; line-height: 1.4;
  }
  header { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.05em; }
  header .meta { color: #888; font-size: 12px; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel { border: 1px solid #333; padding: 12px; background: #12151a; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #888; margin: 0 0 8px; }
  textarea { width: 100%; min-height: 140px; background: #0b0d10; color: #d8dee4;
    border: 1px solid #333; padding: 8px; font-family: inherit; font-size: 13px; resize: vertical; }
  button { background: #1b2027; color: #d8dee4; border: 1px solid #444; padding: 8px 16px;
    font-family: inherit; cursor: pointer; margin-top: 8px; }
  button:hover { background: #232a33; }
  button:disabled { opacity: 0.5; cursor: default; }
  .verdict-box { border: 1px solid #444; padding: 10px; margin-bottom: 12px; }
  .verdict-pass { border-color: #2e7d32; background: #12210f; }
  .verdict-block { border-color: #c62828; background: #250f0f; }
  .verdict-escalate { border-color: #b8860b; background: #241c08; }
  .verdict-label { font-size: 16px; font-weight: bold; letter-spacing: 0.05em; }
  .verdict-pass .verdict-label { color: #66bb6a; }
  .verdict-block .verdict-label { color: #ef5350; }
  .verdict-escalate .verdict-label { color: #d4a017; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .row .k { color: #888; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #222; font-size: 12px; }
  th { color: #888; font-weight: normal; }
  .pass-cell { color: #66bb6a; }
  .fail-cell { color: #ef5350; }
  .placeholder { color: #666; font-style: italic; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12px; }
  .why-not-block { border-left: 3px solid #d4a017; padding: 6px 8px; margin-top: 8px;
    background: #1a1608; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>LEDGER ORACLE</h1>
  <span class="meta" id="engineMeta">engine v-- . fuzz=-- . Rs 0</span>
</header>

<div class="layout">
  <div class="panel">
    <h2>Customer claim</h2>
    <textarea id="claimText" placeholder="Paste the customer's message here...">bhai maine 2499 pay kiya, UTR 526112345678, order 4471 abhi tak nahi aaya</textarea>
    <div><button id="verifyBtn">VERIFY</button></div>

    <h2 style="margin-top:16px;">Parsed</h2>
    <div id="parsedFields"><span class="placeholder">-- run VERIFY to see the parsed claim --</span></div>
  </div>

  <div class="panel">
    <h2>Verdict</h2>
    <div id="verdictBox" class="verdict-box">
      <span class="placeholder">-- no verdict yet --</span>
    </div>

    <h2>Investigation</h2>
    <table id="toolsTable">
      <thead><tr><th>#</th><th>tool</th><th>result</th><th>latency</th></tr></thead>
      <tbody><tr><td colspan="4" class="placeholder">no tool calls yet</td></tr></tbody>
    </table>

    <h2 style="margin-top:12px;">Invariants</h2>
    <table id="invariantsTable">
      <thead><tr><th>invariant</th><th>status</th><th>detail</th></tr></thead>
      <tbody><tr><td colspan="3" class="placeholder">no invariants yet</td></tr></tbody>
    </table>

    <details style="margin-top:12px;">
      <summary style="cursor:pointer; color:#888; font-size:12px; text-transform:uppercase; letter-spacing:0.08em;">raw evidence</summary>
      <pre id="evidenceBlock" class="placeholder">-- no evidence yet --</pre>
    </details>

    <div id="whyNotBlock" style="display:none;" class="why-not-block"></div>
  </div>
</div>

<script>
/*
 * Expected POST /verify response shape (defensive against anything missing --
 * app.py is being wired separately, this page degrades gracefully field-by-field):
 * {
 *   decision: "pass" | "block" | "escalate",
 *   reason_code: string,
 *   max_refundable_paise: number,
 *   why_not_block: string | null,
 *   extracted: { claim_type, order_id, claimed_reference, claimed_amount_paise,
 *                claimed_instrument, claimed_payee_vpa, claimed_timestamp_iso } | null,
 *   tools_called: [ { tool: string, args: object, timestamp: string } ],
 *   evidence: [ ... tool result objects, shape varies by tool ... ],
 *   invariants: [ { invariant: "I1"|"I2"|"I3", passed: bool, detail: string,
 *                    evidence_rows: string[] } ],
 *   engine_version: string,
 *   tolerance_config: { FUZZ_DISTANCE, AMOUNT_TOLERANCE_PAISE, SETTLEMENT_WINDOW_HOURS },
 *   latency_ms: number  (optional, per-tool latency also expected under tools_called
 *                         or evidence -- rendered from whichever carries it, see below)
 * }
 */

const $ = (id) => document.getElementById(id);

function rupees(paise) {
  if (paise === null || paise === undefined) return "--";
  return "Rs " + (paise / 100).toLocaleString("en-IN", { maximumFractionDigits: 0 });
}

function renderVerdict(v) {
  const box = $("verdictBox");
  const decision = v.decision || "escalate";
  box.className = "verdict-box verdict-" + decision;
  const label = decision.toUpperCase();
  box.innerHTML =
    '<div class="verdict-label">' + label + '</div>' +
    '<div class="row"><span class="k">reason</span><span>' + (v.reason_code ?? "--") + '</span></div>' +
    '<div class="row"><span class="k">max refundable</span><span>' + rupees(v.max_refundable_paise) + '</span></div>';

  const wnb = $("whyNotBlock");
  if (v.why_not_block) {
    wnb.style.display = "block";
    wnb.textContent = "WHY NOT BLOCK: " + v.why_not_block;
  } else {
    wnb.style.display = "none";
  }
}

function renderParsed(extracted) {
  const el = $("parsedFields");
  if (!extracted) {
    el.innerHTML = '<span class="placeholder">-- claim did not parse --</span>';
    return;
  }
  const fields = ["claim_type", "order_id", "claimed_reference", "claimed_amount_paise",
    "claimed_instrument", "claimed_payee_vpa", "claimed_timestamp_iso"];
  el.innerHTML = fields.map((f) => {
    let val = extracted[f];
    if (f === "claimed_amount_paise" && val != null) val = rupees(val);
    return '<div class="row"><span class="k">' + f + '</span><span>' + (val ?? "--") + '</span></div>';
  }).join("");
}

function renderTools(toolsCalled, evidence) {
  const tbody = $("toolsTable").querySelector("tbody");
  if (!toolsCalled || !toolsCalled.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="placeholder">no tool calls</td></tr>';
    return;
  }
  tbody.innerHTML = toolsCalled.map((tc, i) => {
    const ev = (evidence && evidence[i]) || {};
    const latency = ev.query_latency_ms != null ? ev.query_latency_ms + "ms" : "--";
    const summary = summarizeEvidence(ev);
    return '<tr><td>' + (i + 1) + '</td><td>' + (tc.tool ?? "--") + '</td><td>' +
      summary + '</td><td>' + latency + '</td></tr>';
  }).join("");
}

function summarizeEvidence(ev) {
  if (ev.matches) return ev.matches.length + " match(es), " + (ev.near_matches?.length ?? 0) + " near";
  if (ev.captures) return ev.captures.length + " capture(s)";
  if (ev.refunds) return ev.refunds.length + " refund(s)";
  if (ev.duplicate_pairs) return ev.duplicate_pairs.length + " duplicate pair(s)";
  if (ev.found !== undefined) return ev.found ? "found" : "not found";
  if (ev.error_class) return "ERROR: " + ev.error_class;
  return "--";
}

function renderInvariants(invariants) {
  const tbody = $("invariantsTable").querySelector("tbody");
  if (!invariants || !invariants.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="placeholder">no invariants</td></tr>';
    return;
  }
  tbody.innerHTML = invariants.map((inv) => {
    const cls = inv.passed ? "pass-cell" : "fail-cell";
    const status = inv.passed ? "OK" : "FAIL";
    return '<tr><td>' + inv.invariant + '</td><td class="' + cls + '">' + status +
      '</td><td>' + (inv.detail ?? "") + '</td></tr>';
  }).join("");
}

function renderEvidence(evidence) {
  const el = $("evidenceBlock");
  if (!evidence || !evidence.length) {
    el.textContent = "-- no evidence --";
    el.className = "placeholder";
    return;
  }
  el.className = "";
  el.textContent = JSON.stringify(evidence, null, 2);
}

function renderMeta(v) {
  const parts = [];
  parts.push("engine v" + (v.engine_version ?? "--"));
  const tc = v.tolerance_config;
  if (tc) parts.push("fuzz=" + tc.FUZZ_DISTANCE);
  $("engineMeta").textContent = parts.join(" . ");
}

async function verify() {
  const btn = $("verifyBtn");
  btn.disabled = true;
  btn.textContent = "VERIFYING...";
  try {
    const res = await fetch("/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("claimText").value }),
    });
    const data = await res.json();
    renderVerdict(data);
    renderParsed(data.extracted);
    renderTools(data.tools_called, data.evidence);
    renderInvariants(data.invariants);
    renderEvidence(data.evidence);
    renderMeta(data);
  } catch (err) {
    $("verdictBox").innerHTML = '<span class="fail-cell">Request failed: ' + err + '</span>';
  } finally {
    btn.disabled = false;
    btn.textContent = "VERIFY";
  }
}

$("verifyBtn").addEventListener("click", verify);
</script>
</body>
</html>
